[project]
name = "statsbudsjett"
version = "0.1.0"
description = "Statsbudsjettet 2027, forklart for folk flest"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/app", "src/adapters", "src/pipeline"]

[dependency-groups]
# Offline pipeline: download sources and build datasets/. Not needed to serve the site.
pipeline = ["polars", "fastexcel", "pypdf"]
dev = ["pytest", "httpx", "ruff", "ty"]

[tool.uv]
default-groups = ["pipeline", "dev"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv"
