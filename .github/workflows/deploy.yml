# Every push to main is checked, then deployed to Fly. Needs the FLY_API_TOKEN repository secret.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uv run ty check src tests
      # pipeline.verify is not run here: it needs the downloaded sources in data/, which are not committed
      - run: uv run pytest -q

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://budsjettlupa.no
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
