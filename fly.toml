# Static site: build it locally with `uv run python viz/build.py && uv run python viz/explorer.py`, then `fly deploy`.
app = "statsbudsjett"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
