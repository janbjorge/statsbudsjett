# Build datasets/ with `uv run python -m pipeline.datasets` and commit it, then push to main: .github/workflows/deploy.yml deploys it.
app = "statsbudsjett"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/helse"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
